<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="A simple generic React + Tailwind boilerplate for LLM-generated applications."
    />
    <title>Simple React Boilerplate</title>
    <script>
      (() => {
        const storageKey = 'basic-react-theme';
        const savedTheme = localStorage.getItem(storageKey) || 'system';
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
        const resolvedTheme = savedTheme === 'system' ? systemTheme : savedTheme;

        document.documentElement.classList.toggle('dark', resolvedTheme === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
